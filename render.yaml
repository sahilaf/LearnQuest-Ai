# Render blueprint for the LearnQuest AI backend. OWNER: Member 3 (plan.md 8.5).
# Secrets are NOT set here - add them in the Render dashboard.
services:
  - type: web
    name: learnquest-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEV_ALLOW_ANONYMOUS
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Set these in the dashboard, never in this file:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
